spring.application.name=banking-backend
server.port=8080
# Browsers can send large localhost cookies; the default 8KB header limit rejects them.
server.max-http-request-header-size=64KB

# MySQL (default profile). Override credentials with DB_USERNAME / DB_PASSWORD env vars.
# Run with --spring.profiles.active=dev to use an in-memory H2 database instead.
spring.datasource.url=jdbc:mysql://localhost:3306/banking_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA / Hibernate — tables are created/updated from the entity classes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.time-zone=Asia/Kolkata

# Security. Set JWT_SECRET (base64, 256+ bits) in any shared or production environment.
bank.jwt.secret=${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1iaGFyYXQtbmF0aW9uYWwtYmFuay0yMDI2}
bank.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
bank.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Seed demo users and data on first start (only when the users table is empty).
bank.seed-demo-data=true

logging.level.com.banking=INFO

# Session cookie for the servlet portal (/portal/*). SameSite=Lax stops other sites posting forms with it.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
